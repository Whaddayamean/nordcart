version: 2
models:
  - name: dim_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: dim_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
  - name: fct_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
              config:
                severity: warn
  - name: fct_order_items
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
  - name: fct_customer_ltv
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: fct_inventory_health
    columns:
      - name: stock_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['reorder', 'ok']
  - name: py_customer_segments
    config:
      enabled: "{{ var('enable_python_model', false) | as_bool }}"
