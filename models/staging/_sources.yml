version: 2

sources:
  - name: raw
    description: NordCart raw layer, generated in-warehouse by `dbt run-operation nc_init` (macros/datagen).
    database: "{{ var('nc_raw_database', target.database) }}"
    schema: "{{ var('nc_raw_schema', 'nordcart_raw') }}"
    config:
      loaded_at_field: _loaded_at
    tables:
      - name: orders            # hourly  (nc_tick hourly)
      - name: order_items       # hourly
      - name: customers         # daily   (nc_tick daily)
      - name: products          # weekly  (nc_tick weekly)
      - name: support_tickets   # never changes (dormant)
