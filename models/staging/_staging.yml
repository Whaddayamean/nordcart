version: 2
models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['completed', 'shipped', 'processing', 'cancelled', 'returned']
  - name: stg_order_items
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
  - name: stg_payments
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
  - name: stg_web_events
    columns:
      - name: event_id
        data_tests: [not_null]
  - name: stg_support_tickets
    columns:
      - name: ticket_id
        data_tests: [unique, not_null]
  - name: stg_legacy_store_sales
    columns:
      - name: sale_id
        data_tests: [unique, not_null]
