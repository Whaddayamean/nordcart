name: nordcart
version: "1.0.0"
config-version: 2
profile: nordcart

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "target_dbtstate", "target_hodor", "target_reference", "dbt_packages"]

vars:
  # Where the generated raw data lives (shared by every tool). Defaults: target database, schema nordcart_raw.
  # nc_raw_database: NORDCART_DEMO
  # nc_raw_schema: nordcart_raw
  enable_python_model: false   # see models/marts/py_customer_segments.py

models:
  nordcart:
    # ------------------------------------------------------------------------------------------
    # Read by BOTH dbt State and dbt-hodor (hodor uses the same `state:` block on purpose).
    #   lag_tolerance:            rebuild only if upstream data is newer than the last build by more
    #                             than this window. dbt State's default is 45m; 0s = react immediately.
    #   require_fresh_data_from:  any | all  direct parents must have new data
    # Try e.g.:  --vars '{lag_tolerance: 4h}'
    # ------------------------------------------------------------------------------------------
    +state:
      lag_tolerance: "{{ var('lag_tolerance', '0s') }}"
      require_fresh_data_from: any

    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
    reports:
      +materialized: table
      +schema: reports

seeds:
  nordcart:
    +schema: ref

snapshots:
  nordcart:
    +schema: snapshots
