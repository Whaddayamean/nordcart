name: nordcart
version: "1.0.0"
config-version: 2
profile: nordcart

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Raw data location (shared by every tool). Defaults: target catalog, schema nordcart_raw.
  # nc_raw_database: workspace
  # nc_raw_schema: nordcart_raw

# Records each node's outcome (built / reused / ...) per tool in <catalog>.nordcart_runlog.node_results.
# See macros/run_log.sql and compare_decisions.sql.
on-run-end:
  - "{{ nc_log_results(results) }}"

models:
  nordcart:
    # Read by BOTH dbt State and dbt-hodor.
    #   lag_tolerance: rebuild only if upstream data is newer than the last build by more than this.
    #   0s = react to every change. Override per run: --vars '{lag_tolerance: 4h}'
    +state:
      lag_tolerance: "{{ var('lag_tolerance', '0s') }}"
      require_fresh_data_from: any

    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
    reports:
      +materialized: table
      +schema: reports

seeds:
  nordcart:
    +schema: ref
